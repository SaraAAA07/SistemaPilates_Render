<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Novo Cadastro - Gindri Pilates</title>
</head>
<body>
    <nav class="sidebar">
        <div class="logo-container">
            <img src="/logo.png" alt="Logo">
        </div>

        <a href="/admin" class="nav-link">Painel</a>
        <a href="/listar" class="nav-link">Alunos</a>
        <a href="/cadastro" class="nav-link active">Novo Cadastro</a>
        <a href="/" class="nav-link logout-btn">Sair</a>
    </nav>

    <main class="main-content">
        <div class="header">
            <div>
                <p id="data-cabecalho" class="data-text"></p>
                <h1>Cadastrar Novo Aluno</h1>
            </div>
        </div>

        <div class="content-card">
            <form action="/salvar" method="POST">

                <div class="form-group">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Ex: Maria da Silva" required>
                </div>

                <div class="form-group">
                    <label for="patologia">Patologia / Queixa principal</label>
                    <input type="text" id="patologia" name="patologia" placeholder="Ex: Dor lombar, hérnia..." required>
                </div>

                <div class="form-group">
                    <label for="emDia">Status do pagamento</label>
                    <select id="emDia" name="emDia" required>
                        <option value="true">Pagamento em dia</option>
                        <option value="false">Pendente / atrasado</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="acesso">Permitir acesso ao sistema?</label>
                    <select name="acesso" id="acesso" onchange="toggleLoginFields()">
                        <option value="nao">Não</option>
                        <option value="sim">Sim</option>
                    </select>
                </div>

                <div id="loginFields" style="display:none;">
                    <div class="form-group">
                        <label for="usuario">Usuário do aluno</label>
                        <input type="text" id="usuario" name="usuario" placeholder="Ex: maria">
                    </div>

                    <div class="form-group">
                        <label for="senha">Senha do aluno</label>
                        <input type="password" id="senha" name="senha" placeholder="Digite uma senha">
                    </div>
                </div>

                <div class="form-group">
                <label for="frequencia">Frequência semanal</label>

                <select id="frequencia" name="frequencia" onchange="mostrarDias()">
                    <option value="">Selecione</option>
                    <option value="1">1x por semana</option>
                    <option value="2">2x por semana</option>
                    <option value="3">3x por semana</option>
                    <option value="4">4x por semana</option>
                    <option value="5">5x por semana</option>
                </select>
            </div>

            <div id="diasContainer" class="form-group" style="display:none;">
                <label>Dias da semana</label>

                <div class="dias-grid">

                    <label class="dia-card">
                        <input type="checkbox" name="dias" value="Segunda">
                        Segunda
                    </label>

                    <label class="dia-card">
                        <input type="checkbox" name="dias" value="Terça">
                        Terça
                    </label>

                    <label class="dia-card">
                        <input type="checkbox" name="dias" value="Quarta">
                        Quarta
                    </label>

                    <label class="dia-card">
                        <input type="checkbox" name="dias" value="Quinta">
                        Quinta
                    </label>

                    <label class="dia-card">
                        <input type="checkbox" name="dias" value="Sexta">
                        Sexta
                    </label>
                </div>
            </div>

                <div class="form-group">
                    <label for="pontos">Pontos de fidelidade</label>
                    <input type="number" id="pontos" name="pontos" value="0" min="0">
                </div>

                <div class="form-group">
                    <label for="pagamento">Status financeiro</label>
                    <select id="pagamento" name="pagamento">
                        <option>Pago</option>
                        <option>Pendente</option>
                        <option>Atrasado</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="aulasRealizadas">Quantidade de aulas realizadas</label>
                    <input type="number" id="aulasRealizadas" name="aulasRealizadas" value="0" min="0">
                </div>

                <div class="form-group">
                    <label for="dataAula">Data da aula</label>
                    <input type="date" id="dataAula" name="dataAula">
                </div>

                <div class="form-group">
                    <label for="horario">Horário da aula</label>
                    <input type="time" id="horario" name="horario">
                </div>

                <div class="form-group">
                    <label for="modalidade">Modalidade</label>
                    <select id="modalidade" name="modalidade">
                        <option>Pilates</option>
                        <option>Funcional</option>
                        <option>Pilates e Funcional</option>
                    </select>
                </div>

                <div style="margin-top: 30px; text-align: right;">
                    <button type="submit" class="btn-primary" style="width: auto;">
                        Salvar cadastro
                    </button>
                </div>
            </form>
        </div>

        <footer>
            <p>&copy; 2026 Gindri Pilates. Todos os direitos reservados.</p>
        </footer>
    </main>

    <script>
        function toggleLoginFields() {
            const acesso = document.getElementById("acesso").value;
            const fields = document.getElementById("loginFields");

            fields.style.display = acesso === "sim" ? "block" : "none";
        }

        const opcoesData = {
            weekday: 'long',
            day: 'numeric',
            month: 'long',
            year: 'numeric'
        };

        document.getElementById('data-cabecalho').innerText =
            new Date().toLocaleDateString('pt-BR', opcoesData);
    </script>
</body>
</html>
