<!DOCTYPE html>

<html lang="pt-br">

<head>

<meta charset="UTF-8">

<title>Painel do aluno</title>

<link rel="stylesheet" href="/style.css">

</head>

<body>

<main class="main-content">

<div class="content-card">

<h1 id="tituloAluno">Boa noite aluno</h1>

<div class="dashboard-grid">

<div class="dashboard-card">
<h3>Frequência</h3>
<p id="frequencia"></p>
</div>

<div class="dashboard-card">
<h3>Pontos fidelidade</h3>
<p id="pontos"></p>
</div>

<div class="dashboard-card">
<h3>Status pagamento</h3>
<p id="pagamento"></p>
</div>

<div class="dashboard-card">
<h3>Aulas realizadas</h3>
<p id="aulas"></p>
</div>

</div>

<br>

<div class="content-card">

<h2>Horários das aulas</h2>

<p id="horarios"></p>

</div>

<br>

<div class="content-card">

<h2>Modalidades</h2>

<p id="modalidades"></p>

</div>

</div>

</main>

<script>

fetch('/dadosAluno')

.then(r => r.json())

.then(aluno => {

document.getElementById("tituloAluno").innerHTML =
"Boa noite, " + aluno.nome;

document.getElementById("frequencia").innerHTML =
aluno.frequencia;

document.getElementById("pontos").innerHTML =
aluno.pontos;

document.getElementById("pagamento").innerHTML =
aluno.pagamento;

document.getElementById("aulas").innerHTML =
aluno.aulas;

document.getElementById("horarios").innerHTML =
aluno.horarios.replaceAll("|", "<br>");

document.getElementById("modalidades").innerHTML =
aluno.modalidades.replaceAll("|", "<br>");

});

</script>

</body>

</html>
