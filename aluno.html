<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel do Aluno</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<nav class="sidebar">

    <div class="logo-container">
        <img src="/logo.png">
    </div>

    <a href="/aluno" class="nav-link active">Meu Painel</a>

    <a href="/" class="nav-link logout">🚪 Sair</a>

</nav>

<main class="main-content">

    <div class="header">
        <p id="dataAtual"></p>
        <h1 id="nomeAluno">Boa noite</h1>
    </div>

    <div class="dashboard-grid">

        <div class="dashboard-card">
            <h3>FREQUÊNCIA</h3>
            <p id="frequencia">-</p>
        </div>

        <div class="dashboard-card">
            <h3>PONTOS</h3>
            <p id="pontos">0</p>
        </div>

        <div class="dashboard-card">
            <h3>PAGAMENTO</h3>
            <p id="pagamento">-</p>
        </div>

        <div class="dashboard-card">
            <h3>AULAS</h3>
            <p id="aulas">0</p>
        </div>

    </div>

    <div class="content-card">

        <h2>Minhas Informações</h2>

        <table>

            <tr>
                <th>Patologia</th>
                <th>Horários</th>
                <th>Modalidades</th>
            </tr>

            <tr>
                <td id="patologia"></td>
                <td id="horarios"></td>
                <td id="modalidades"></td>
            </tr>

        </table>

    </div>

</main>

<script>

const dias = [
"domingo",
"segunda-feira",
"terça-feira",
"quarta-feira",
"quinta-feira",
"sexta-feira",
"sábado"
];

const meses = [
"janeiro",
"fevereiro",
"março",
"abril",
"maio",
"junho",
"julho",
"agosto",
"setembro",
"outubro",
"novembro",
"dezembro"
];

const hoje = new Date();

document.getElementById("dataAtual").innerHTML =
dias[hoje.getDay()] + ", " +
hoje.getDate() + " de " +
meses[hoje.getMonth()];

fetch("/dadosAluno")
.then(r => r.json())
.then(dados => {

    document.getElementById("nomeAluno").innerHTML =
    "Boa noite, " + dados.nome;

    document.getElementById("frequencia").innerHTML =
    dados.frequencia;

    document.getElementById("pontos").innerHTML =
    dados.pontos;

    document.getElementById("pagamento").innerHTML =
    dados.pagamento;

    document.getElementById("aulas").innerHTML =
    dados.aulas;

    document.getElementById("patologia").innerHTML =
    dados.patologia;

    document.getElementById("horarios").innerHTML =
    dados.horarios;

    document.getElementById("modalidades").innerHTML =
    dados.modalidades;

});

</script>

</body>
</html>
