<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login - Gindri Pilates</title>
</head>
<body>

    <div class="login-container">

        <div class="login-box">

            <img
                src="/logo.png"
                alt="Estúdio Gindri Pilates"
                style="max-width:180px; margin:0 auto 20px auto; display:block;"
            >

            <h2 style="margin-bottom:10px;">Bem-vindo</h2>

            <p>Acesse sua área</p>

            <form action="/autenticar" method="POST">

                <input
                    type="text"
                    name="usuario"
                    placeholder="Usuário"
                    required
                >

                <input
                    type="password"
                    name="senha"
                    placeholder="Senha"
                    required
                >

                <button
                    type="submit"
                    class="btn-primary"
                    style="margin-top:15px; width:100%;"
                >
                    Entrar
                </button>

            </form>

        </div>

    </div>

</body>
</html>
