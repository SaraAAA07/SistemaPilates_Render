<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel Admin</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<nav class="sidebar">

    <div class="logo-container">
        <img src="/logo.png">
    </div>

    <a href="/admin" class="nav-link active">Painel</a>
    <a href="/listar" class="nav-link">Alunos</a>
    <a href="/cadastro" class="nav-link">Novo Cadastro</a>

    <a href="/" class="nav-link logout">🚪 Sair</a>

</nav>

<main class="main-content">

    <div class="header">
        <p id="dataAtual"></p>
        <h1>Boa noite, Alice</h1>
    </div>

    <div class="dashboard-grid">

        <div class="dashboard-card">
            <h3>ALUNOS ATIVOS</h3>
            <p id="totalAlunos">0</p>
        </div>

        <div class="dashboard-card">
            <h3>AULAS HOJE</h3>
            <p id="aulasHoje">0</p>
        </div>

        <div class="dashboard-card">
            <h3>INADIMPLENTES</h3>
            <p id="inadimplentes">0</p>
        </div>

        <div class="dashboard-card">
            <h3>CONCLUÍDAS</h3>
            <p id="concluidas">0</p>
        </div>

    </div>

    <div class="content-card">

        <h2>Agenda de Hoje</h2>

        <table>

            <tr>
                <th>HORÁRIO</th>
                <th>NOME</th>
                <th>MODALIDADE</th>
            </tr>

            <tr>
                <td>08:00</td>
                <td>Maria Clara Oliveira</td>
                <td>Pilates</td>
            </tr>

            <tr>
                <td>09:00</td>
                <td>João Pedro Santos</td>
                <td>Pilates</td>
            </tr>

        </table>

    </div>

    <div class="footer">
        © 2026 Alice Hemann Gindri. Todos os direitos reservados.
    </div>

</main>

<script>

const dias = [
"domingo",
"segunda-feira",
"terça-feira",
"quarta-feira",
"quinta-feira",
"sexta-feira",
"sábado"
];

const meses = [
"janeiro",
"fevereiro",
"março",
"abril",
"maio",
"junho",
"julho",
"agosto",
"setembro",
"outubro",
"novembro",
"dezembro"
];

const hoje = new Date();

document.getElementById("dataAtual").innerHTML =
dias[hoje.getDay()] + ", " +
hoje.getDate() + " de " +
meses[hoje.getMonth()];

fetch("/estatisticas")
.then(r => r.json())
.then(dados => {

    document.getElementById("totalAlunos").innerHTML = dados.total;
    document.getElementById("inadimplentes").innerHTML = dados.inadimplentes;

    document.getElementById("aulasHoje").innerHTML = dados.total;

});

</script>

</body>
</html>
