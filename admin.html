<!DOCTYPE html>

<html lang="pt-br">

<head>

<meta charset="UTF-8">

<title>Painel Admin</title>

<link rel="stylesheet" href="/style.css">

</head>

<body>

<nav class="sidebar">

<div class="logo-container">

<img src="/logo.png">

</div>

<a href="/admin" class="nav-link active">Painel</a>

<a href="/listar" class="nav-link">Alunos</a>

<a href="/cadastro" class="nav-link">Novo Cadastro</a>

<a href="/" class="nav-link">Sair</a>

</nav>

<main class="main-content">

<div class="header">

<p id="dataAtual"></p>

<h1>Dashboard</h1>

</div>

<div class="dashboard-grid">

<div class="dashboard-card">

<h3>Total de alunos</h3>

<p id="totalAlunos">0</p>

</div>

<div class="dashboard-card">

<h3>Inadimplentes</h3>

<p id="inadimplentes">0</p>

</div>

<div class="dashboard-card">

<h3>Sistema</h3>

<p>Online</p>

</div>

</div>

<div class="content-card">

<h2>Bem-vinda Alice 👋</h2>

<p>
Gerencie alunos, pagamentos, frequência,
modalidades, horários e fidelidade.
</p>

</div>

</main>

<script>

const hoje = new Date();

document.getElementById("dataAtual").innerHTML =
hoje.toLocaleDateString("pt-BR");

fetch('/estatisticas')

.then(r => r.json())

.then(dados => {

document.getElementById("totalAlunos").innerHTML =
dados.total;

document.getElementById("inadimplentes").innerHTML =
dados.inadimplentes;

});

</script>

</body>

</html>
