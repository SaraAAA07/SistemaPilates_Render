<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Painel Alice Hemann</title>
</head>
<body>
    <nav class="sidebar">
        <div class="logo-container">
            <img src="/logo.png" alt="Logo">
